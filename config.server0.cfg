[connectivity]

# SERVER=0 — TABLE NODE
# Stores B-tree nodes in HBM and serves remote RDMA reads/writes from peer head nodes.
#
# Expected kernel instances after link:
# INFO: [CFGEN 83-0]   kernel: cmac_krnl, num: 1  {cmac_krnl_1}
# INFO: [CFGEN 83-0]   kernel: rocetest_krnl, num: 1  {rocetest_krnl_1}
# INFO: [CFGEN 83-0]   kernel: krnl, num: 1  {krnl_1}

slr=cmac_krnl_1:SLR2

# Memory mapping
# Table-node RoCE serves peer RDMA reads out of the tree memory buffer, so
# rocetest m00_axi must share the same bank as krnl hbm.
sp=rocetest_krnl_1.m00_axi:HBM[1]
sp=krnl_1.hbm:HBM[1]
sp=krnl_1.resp_in:HBM[0]
sp=krnl_1.req_buffer:HBM[2]
sp=krnl_1.resp_buffer:HBM[3]

# CMAC <-> ROCETEST (network path)
sc=cmac_krnl_1.axis_net_rx:rocetest_krnl_1.s_axis_net_rx
sc=rocetest_krnl_1.m_axis_net_tx:cmac_krnl_1.axis_net_tx

# ROCETEST <-> KRNL
# RDMA-read command metadata (256b, direct — no bridge)
sc=krnl_1.m_axis_tx_meta:rocetest_krnl_1.s_axis_role_tx_meta
# Per-RDMA-op completion handshake (32b)
sc=rocetest_krnl_1.m_axis_op_completion:krnl_1.s_axis_completion
# Write payload path deferred (see memory/rdma_completion_architecture.md).
