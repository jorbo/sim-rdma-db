[connectivity]

# SERVER=0 — TABLE NODE
# Stores B-tree nodes in HBM and serves remote RDMA reads/writes from peer head nodes.
#
# Expected kernel instances after link:
# INFO: [CFGEN 83-0]   kernel: cmac_krnl, num: 1  {cmac_krnl_1}
# INFO: [CFGEN 83-0]   kernel: rocetest_krnl, num: 1  {rocetest_krnl_1}
# INFO: [CFGEN 83-0]   kernel: krnl, num: 1  {krnl_1}

slr=cmac_krnl_1:SLR2

# Memory mapping
sp=rocetest_krnl_1.m00_axi:HBM[0]
sp=krnl_1.hbm:HBM[1]
sp=krnl_1.req_buffer:HBM[2]
sp=krnl_1.resp_buffer:HBM[3]

# CMAC <-> ROCETEST (network path)
sc=cmac_krnl_1.axis_net_rx:rocetest_krnl_1.s_axis_net_rx
sc=rocetest_krnl_1.m_axis_net_tx:cmac_krnl_1.axis_net_tx

# KRNL <-> BRIDGE <-> ROCETEST (role interfaces)
# Bridge adapts krnl's 256b meta / 64b rx_data to rocetest's 512b role lanes.
# tx_data is bridge-synthesized (krnl write-path not yet implemented).
sc=krnl_1.m_axis_tx_meta:bridge_krnl_1.s_axis_krnl_meta
sc=bridge_krnl_1.m_axis_role_meta:rocetest_krnl_1.s_axis_role_tx_meta
sc=bridge_krnl_1.m_axis_role_data:rocetest_krnl_1.s_axis_role_tx_data
sc=rocetest_krnl_1.m_axis_role_tx_status:bridge_krnl_1.s_axis_role_status
sc=rocetest_krnl_1.m_axis_role_rx_data:bridge_krnl_1.s_axis_role_rx_data
sc=bridge_krnl_1.m_axis_krnl_rx_data:krnl_1.s_axis_rx_data
