[connectivity]

# EMULATION-ONLY (sw_emu/hw_emu) — single node.
# Replaces rocetest_krnl + cmac_krnl with roce_stub so xsim does not have to
# elaborate the RoCE stack or the CMAC hard IP (which crashes sim init).
# RDMA reads "complete" instantly with a dummy token; resp_in is never
# written, so fetches of remote-owned nodes return garbage. Single-node
# tests only. Full-stack emulation: build with FULL_EMU=1.

# Memory mapping — mirrors config.server0.cfg
sp=krnl_1.resp_in:HBM[0]
sp=krnl_1.hbm:HBM[1]
sp=krnl_1.req_buffer:HBM[2]
sp=krnl_1.resp_buffer:HBM[3]

# KRNL <-> STUB
sc=krnl_1.m_axis_tx_meta:roce_stub_1.s_axis_tx_meta
sc=roce_stub_1.m_axis_completion:krnl_1.s_axis_completion
